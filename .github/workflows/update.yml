name: Tagesausgabe

on:
  schedule:
    - cron: "15 4 * * *"   # täglich 04:15 UTC, also 5:15 bzw. 6:15 Uhr deutscher Zeit
  workflow_dispatch:        # zusätzlich per Knopfdruck unter "Actions" startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: Neue Ausgabe speichern
        run: |
          git config user.name "lichtblick-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Ausgabe vom $(TZ=Europe/Berlin date +%Y-%m-%d)"
          git push
